<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4ecdc4"/>
      <stop offset="100%" style="stop-color:#45b7aa"/>
    </linearGradient>
    <linearGradient id="orange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f39c12"/>
      <stop offset="100%" style="stop-color:#e67e22"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="200" height="200" rx="30" ry="30" fill="url(#bg)"/>
  
  <!-- G -->
  <text x="45" y="110" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="60" fill="#ffffff" text-anchor="middle">G</text>
  
  <!-- X -->
  <text x="120" y="110" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="65" fill="url(#orange)" text-anchor="middle">X</text>
  
  <!-- Engine text -->
  <text x="100" y="145" font-family="Arial, sans-serif" font-weight="300" font-size="24" fill="url(#accent)" text-anchor="middle" letter-spacing="6">Engine</text>
  
  <!-- Decorative line -->
  <line x1="30" y1="155" x2="170" y2="155" stroke="url(#accent)" stroke-width="1" opacity="0.3"/>
  
  <!-- Small game controller icon -->
  <g transform="translate(65, 165)" opacity="0.6">
    <rect x="0" y="5" width="30" height="18" rx="9" fill="url(#accent)"/>
    <rect x="5" y="10" width="8" height="3" rx="1" fill="#1a1a2e"/>
    <rect x="8" y="7" width="3" height="9" rx="1" fill="#1a1a2e"/>
    <circle cx="23" cy="14" r="3" fill="url(#orange)"/>
  </g>
</svg>